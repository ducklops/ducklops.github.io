<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ducklops Console</title>
<meta name="theme-color" content="#43c767">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../assets/fonts/tiny5.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/black-han-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  body { background: var(--cream); }
  .con { max-width: 1040px; margin: 0 auto; padding: 28px 16px 80px; }
  .con .win-body { padding: 24px 28px 30px; }
  @media (max-width: 700px) { .con { padding: 14px 10px 60px; } .con .win-body { padding: 18px 14px 22px; } }
  .con h1 { font-size: clamp(34px, 7vw, 64px); margin: 0 0 6px; }
  .con h2 { font-family: var(--font-body); font-weight: 400; text-transform: uppercase; letter-spacing: .12em; font-size: 19px; margin: 26px 0 12px; display: flex; align-items: center; gap: 12px; }
  .con h2::after { content: ""; flex: 1; height: 3px; background: repeating-linear-gradient(90deg, var(--ink) 0 6px, transparent 6px 10px); }
  .con h2:first-child { margin-top: 0; }
  .hint { color: var(--muted); font-size: 15px; margin: 4px 0 0; line-height: 1.4; }
  .hint code, .cheat code { background: var(--paper-2); border: 1px solid var(--bezel-dk); padding: 0 4px; font-family: "Courier New", monospace; font-size: 14px; }

  /* form controls */
  .field { display: grid; gap: 6px; margin: 0 0 16px; }
  .field > span { font-size: 15px; letter-spacing: .1em; text-transform: uppercase; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 18px; }
  :is(.con, .popup) :is(input[type=text], input[type=url], input[type=password], input[type=number], input[type=date], input[type=datetime-local], textarea, select) {
    width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: var(--paper-2);
    border: 3px solid var(--ink); box-shadow: inset 2px 2px 0 var(--bezel); padding: 8px 10px; border-radius: 0;
  }
  .con textarea { min-height: 96px; resize: vertical; line-height: 1.45; }
  .con textarea.mono { font-family: "Courier New", monospace; font-size: 16px; min-height: 380px; }
  :is(.con, .popup) :is(input, textarea, select):focus { outline: 3px dashed var(--green-dk); outline-offset: 2px; }
  .con input[readonly] { background: var(--cream); color: var(--muted); }
  .check { display: flex; gap: 10px; align-items: center; font-size: 16px; margin: 0 0 16px; cursor: pointer; }
  .check input { width: 22px; height: 22px; accent-color: var(--green-dk); }
  .switch { display: inline-flex; border: 3px solid var(--ink); box-shadow: var(--shadow-sm); margin: 0 0 16px; }
  .switch button { font: inherit; font-size: 16px; letter-spacing: .1em; padding: 7px 16px 6px; border: 0; background: var(--paper-2); color: var(--ink); cursor: pointer; }
  .switch button + button { border-left: 3px solid var(--ink); }
  .switch button[aria-pressed=true] { background: var(--green); }
  .switch button.off[aria-pressed=true] { background: var(--ink); color: var(--paper); }
  .con .btn { font-size: 15px; padding: 7px 13px 6px; }
  .btn.small { font-size: 13px; padding: 4px 9px 3px; box-shadow: 2px 2px 0 var(--ink); }
  .btn.danger:hover { background: var(--red); color: var(--paper); }
  .btn[disabled] { opacity: .45; pointer-events: none; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 8px; }

  /* top bar */
  .topbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .who { font-size: 15px; letter-spacing: .08em; }
  .who b { font-weight: 400; background: var(--green-lt); padding: 0 4px; }
  .pending { display: inline-grid; place-items: center; min-width: 26px; height: 24px; padding: 0 6px; background: var(--yellow); border: 2px solid var(--ink); font-size: 14px; margin-left: 4px; }

  /* tabs */
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 3px solid var(--ink); margin: 0 -28px 22px; padding: 0 28px; }
  @media (max-width: 700px) { .tabs { margin: 0 -14px 18px; padding: 0 14px; } }
  .tabs button { font: inherit; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); background: var(--cream); border: 3px solid var(--ink); border-bottom: 0; padding: 8px 12px 6px; cursor: pointer; position: relative; top: 3px; }
  .tabs button[aria-selected=true] { background: var(--paper); border-bottom: 3px solid var(--paper); }
  .tabs button .dot { display: inline-block; width: 9px; height: 9px; background: var(--yellow); border: 2px solid var(--ink); margin-left: 6px; vertical-align: 0; }

  /* lists */
  .list { border: 3px solid var(--ink); background: var(--paper-2); box-shadow: var(--shadow-sm); }
  .item { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px 12px; border-top: 2px dashed var(--bezel-dk); }
  .item:first-child { border-top: 0; }
  .item img { width: 96px; aspect-ratio: 16/9; object-fit: cover; border: 2px solid var(--ink); background: var(--navy); }
  .item .noimg { width: 96px; aspect-ratio: 16/9; border: 2px solid var(--ink); background: var(--navy); color: var(--lcd); display: grid; place-items: center; font-size: 11px; letter-spacing: .1em; }
  .item .t { font-size: 17px; line-height: 1.3; }
  .item .m { font-size: 13px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-top: 3px; }
  .item .b { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  @media (max-width: 640px) { .item { grid-template-columns: 70px minmax(0,1fr); } .item img, .item .noimg { width: 70px; } .item .b { grid-column: 1 / -1; justify-content: flex-start; } }
  .tag-soon { background: var(--yellow); padding: 0 4px; color: var(--ink); }
  .tag-new { background: var(--green-lt); padding: 0 4px; color: var(--ink); }

  .fix { border: 3px solid var(--ink); background: var(--paper-2); padding: 14px 14px 2px; margin: 0 0 14px; box-shadow: var(--shadow-sm); }
  .fix-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; }
  .vid-preview { display: flex; gap: 14px; align-items: center; margin: -4px 0 16px; }
  .vid-preview img { width: 160px; aspect-ratio: 16/9; object-fit: cover; border: 3px solid var(--ink); }

  .editor-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .preview-box { border: 3px solid var(--ink); background: var(--paper-2); padding: 18px 22px; min-height: 380px; max-height: 70vh; overflow: auto; }
  .preview-box .prose { font-size: 18px; }
  .cheat { font-size: 14px; color: var(--muted); line-height: 1.7; margin: 6px 0 16px; }

  /* banner preview reuses the site's marquee styles */
  .bn-preview { border: 3px solid var(--ink); margin: 0 0 18px; }
  .bn-preview .marquee { border-bottom: 0; }

  /* messages */
  .msg { border: 3px solid var(--ink); padding: 10px 14px; margin: 0 0 16px; font-size: 16px; background: var(--paper-2); }
  .msg.err { background: #fde2df; }
  .msg.ok { background: var(--green-lt); }
  .msg.warn { background: #fff3c4; }
  .steps { margin: 8px 0 0; padding-left: 22px; line-height: 1.6; font-size: 16px; }
  .steps li { margin: 4px 0; }
  details.how { border: 3px solid var(--ink); background: var(--paper-2); padding: 10px 14px; margin: 18px 0 0; }
  details.how summary { cursor: pointer; letter-spacing: .08em; text-transform: uppercase; font-size: 15px; }
  .filelist { margin: 8px 0 14px; padding-left: 20px; font-family: "Courier New", monospace; font-size: 15px; }
  [hidden] { display: none !important; }
</style>
</head>
<body data-base="../">
<div class="con">
  <div class="win">
    <div class="win-bar"><img class="px" src="../assets/img/notepad.svg" alt=""><span class="win-title">CONSOLE.EXE</span>
      <span class="win-btns"><span aria-hidden="true">_</span><span aria-hidden="true">□</span><a href="../" aria-label="Close, back to the site">×</a></span></div>
    <div class="win-body">
      <div id="app"><p class="kicker">Starting up…</p></div>
    </div>
    <div class="win-status"><span class="led" id="status">Not connected</span><span>Changes go live about a minute after publishing</span></div>
  </div>
</div>
<script src="../assets/js/readables.js"></script>
<script src="console.js"></script>
</body>
</html>
