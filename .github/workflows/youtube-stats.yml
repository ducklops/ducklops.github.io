# Fetches Ducklops subscriber count + latest upload from YouTube and saves
# them to assets/data/youtube.json. The API key is a private repo secret
# (Settings -> Secrets and variables -> Actions -> YOUTUBE_API_KEY) and is
# never written into the site.

name: YouTube stats

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:          # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: youtube-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats from YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CHANNEL_ID: UCfzosx6K6cPJolK7zgRDAqg
        run: |
          node - <<'EOF'
          const fs = require("fs");
          const key = process.env.YOUTUBE_API_KEY, ch = process.env.CHANNEL_ID;
          if (!key) { console.error("YOUTUBE_API_KEY secret is not set."); process.exit(1); }
          const base = "https://www.googleapis.com/youtube/v3/";
          const get = async (u) => {
            const r = await fetch(base + u + "&key=" + encodeURIComponent(key));
            const j = await r.json();
            if (!r.ok) throw new Error((j.error && j.error.message) || r.status);
            return j;
          };
          (async () => {
            const out = {};
            const c = await get("channels?part=statistics&id=" + ch);
            const st = c.items && c.items[0] && c.items[0].statistics;
            if (st && !st.hiddenSubscriberCount) out.subscriberCount = Number(st.subscriberCount);
            const p = await get("playlistItems?part=snippet&maxResults=1&playlistId=UU" + ch.slice(2));
            const sn = p.items && p.items[0] && p.items[0].snippet;
            if (sn && sn.resourceId) {
              const first = (sn.description || "").split(/\n/)[0];
              out.latestVideo = {
                id: sn.resourceId.videoId,
                title: sn.title,
                blurb: first.length > 20 && first.length < 220 ? first : ""
              };
            }
            fs.mkdirSync("assets/data", { recursive: true });
            fs.writeFileSync("assets/data/youtube.json", JSON.stringify(out, null, 2) + "\n");
            console.log(out);
          })().catch((e) => { console.error("YouTube API error:", e.message); process.exit(1); });
          EOF

      - name: Save if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/youtube.json
          git diff --cached --quiet || git commit -m "Update YouTube stats"
          git push
